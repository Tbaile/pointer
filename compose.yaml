x-app: &app
  build:
    context: .
    target: dev
  image: pointer:dev
  environment:
    SERVER_NAME: ":80"
    POINTER_SUPPORT_IDENTITY_FILE: /home/pointer/.ssh/pointer
    POINTER_SUPPORT_HOST: ${POINTER_SUPPORT_HOST:-}
    POINTER_SUPPORT_PORT: ${POINTER_SUPPORT_PORT:-}
    POINTER_SUPPORT_IDENTITY: ${POINTER_SUPPORT_IDENTITY:-}
    DB_HOST: postgres
    DB_PORT: 5432
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - 127.0.0.1:8000:80
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5m
      start_interval: 2s

  ci:
    profiles: [ci]
    build:
      context: .
      target: ci
    image: pointer:ci
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  node:
    image: node:24.20.0-trixie-slim
    user: node
    working_dir: /app
    command: ["npm", "run", "dev"]
    environment:
      # Makes laravel-vite-plugin write localhost instead of 0.0.0.0 in public/hot
      LARAVEL_SAIL: 1
    volumes:
      - .:/app
    ports:
      - 127.0.0.1:5173:5173

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pointer}
      POSTGRES_USER: ${DB_USERNAME:-pointer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pointer}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./containers/database/postgres-init-testing.sql:/docker-entrypoint-initdb.d/testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
