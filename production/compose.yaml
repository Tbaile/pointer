name: pointer-production

x-app: &app
  build:
    context: ..
    target: prod
  image: pointer:prod
  env_file: .env
  environment:
    POINTER_SUPPORT_IDENTITY_FILE: /home/pointer/.ssh/pointer
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
  volumes:
    - storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - storage:/app/storage
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5m
      start_interval: 2s

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in production/.env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in production/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in production/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  storage:
  caddy-data:
  caddy-config:
  postgres-data:
